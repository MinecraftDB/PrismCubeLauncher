buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.minecraftdb.prismcubelauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.minecraftdb.prismcubelauncher'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        // The repository stores OreUI at android-frontend/not-frontend-asset/hbui.
        // Pointing the Android assets source at its parent makes the packaged
        // path exactly assets/hbui/index.html without copying the frontend.
        main.assets.srcDir "${rootDir}/android-frontend/not-frontend-asset"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Keep release unshrunk until custom ProGuard rules preserve every
            // @JavascriptInterface method exposed as window.AndroidBridge.
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/AL2.0'
            excludes += '/META-INF/LGPL2.1'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
